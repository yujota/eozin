name: NPM Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build script dependencies
        run: |
          cd js-eozin
          npm ci

      - name: Build Web Package
        run: |
          cd js-eozin
          node scripts/build.js @eozin/eozin-web

      - name: Publish Web Package
        uses: js-devtools/npm-publish@v3
        with:
          package: ./js-eozin/npm-packages/web/package.json
          provenance: true
          access: public

      - name: Build Node Package
        run: |
          cd js-eozin
          node scripts/build.js @eozin/eozin-node

      - name: Publish Node Package
        uses: js-devtools/npm-publish@v3
        with:
          package: ./js-eozin/npm-packages/node/package.json
          provenance: true
          access: public
