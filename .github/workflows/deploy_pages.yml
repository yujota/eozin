name: Deploy Multi-Platform Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Public Folder
        run: mkdir -p public/docs/js public/docs/python

      - name: Build Python Docs (MkDocs)
        run: |
          pip install mkdocs-material mkdocstrings[python]
          mkdocs build -f py-eozin/python/mkdocs.yml
          cp -r py-eozin/python/site/* public/docs/python/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          path: public
