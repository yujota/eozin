name: Deploy Multi-Platform Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Public Folder
        run: mkdir -p public/docs/python

      - name: Build Python Docs (MkDocs)
        run: |
          pip install mkdocs-material mkdocstrings[python]
          mkdocs build -f py-eozin/python/mkdocs.yml
          cp -r py-eozin/python/site/* public/docs/python/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  build-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Public Folder
        run: mkdir -p public/docs/js

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build script dependencies
        run: |
          cd js-eozin
          npm ci

      - name: Build Web Package(Dev mode)
        run: |
          cd js-eozin
          node scripts/build.js @eozin/eozin-web-dev

      - name: Build Node Package(Dev mode)
        run: |
          cd js-eozin
          node scripts/build.js @eozin/eozin-node-dev

      - name: Build JS Docs (TypeDoc)
        run: |
          cd js-eozin
          npm run docs
          cp -r docs/api/* public/docs/js/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: [build-python, build-js]

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          path: public
